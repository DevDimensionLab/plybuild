version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      - linters:
          - staticcheck
        text: '^(QF[0-9]+|ST1005):'
      - path: '_test\.go$'
        linters:
          - errcheck
      # These legacy messages are user-visible; preserve their exact text.
      - path: pkg/file/file.go
        linters:
          - staticcheck
        text: "ST1005:"
      # Keep the public Upgrade constant's declaration and inferred type stable.
      - path: pkg/webservice/init.go
        linters:
          - staticcheck
        text: "SA9004:"

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
